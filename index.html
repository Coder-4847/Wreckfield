<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="description" content="Wreckfield — a browser vehicle-combat arena shooter. Five arenas, five cars, cannons, missiles, mines, flak and lasers against three AI drivers." />
    <meta property="og:title" content="Wreckfield" />
    <meta property="og:description" content="Browser vehicle-combat arena shooter built with Three.js + Rapier." />
    <title>Wreckfield</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0d10'/%3E%3Cpath d='M12 18l8 28 12-18 12 18 8-28' fill='none' stroke='%23ff7a2f' stroke-width='6' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E" />
    <style>
      /* Shown instantly (before any JS arrives); main.js replaces it with the real loading screen. */
      html, body { margin: 0; height: 100%; background: #0b0d10; }
      #boot-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: radial-gradient(ellipse at 50% 60%, #1c2027 0%, #0b0d10 70%);
        font: 700 40px/1 'Arial Narrow', Arial, sans-serif; letter-spacing: 0.12em; color: #eceff3;
      }
      #boot-splash b { color: #ff7a2f; font-weight: 700; }
      #boot-splash i { display: block; width: 240px; height: 3px; background: rgba(255,255,255,0.1); overflow: hidden; position: relative; }
      #boot-splash i::after { content: ''; position: absolute; inset: 0; width: 30%; background: #ff7a2f; animation: bootbar 1.1s ease-in-out infinite; }
      @keyframes bootbar { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
    </style>
  </head>
  <body>
    <div id="boot-splash">WRECK<b>FIELD</b><i></i></div>
    <div id="app"></div>
    <div id="ui-root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
